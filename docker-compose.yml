version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: tcc-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/src:/app/src
      - ./backend/persistence:/app/backend/persistence
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/pipeline.db
      - CHECKPOINT_DIR=/app/backend/persistence/checkpoints
      - DATA_DIR=/app/data
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    networks:
      - app-network
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: tcc-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app/frontend
      - ./backend/src:/app/src
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://backend:8000
      - STREAMLIT_SERVER_PORT=8501
      - PYTHONUNBUFFERED=1
    networks:
      - app-network
    depends_on:
      - backend

  db:
    image: python:3.11-slim
    container_name: tcc-db
    command: echo "Using SQLite - no separate DB service needed"
    volumes:
      - ./data:/app/data
    networks:
      - app-network

volumes:
  data:
    driver: local
  checkpoints:
    driver: local

networks:
  app-network:
    driver: bridge
